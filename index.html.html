<style>
:root{
  --bg:#FFFFFF; --bg2:#FFE94D; --surface:#FFFFFF; --ink:#1F1F24; --sub:#5E5E6A; --line:#FFE45C;
  --glass:#FFFFFF; --sun:#FFD400; --sun-deep:#F5A300; --danger:#F0302A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16161B; --bg2:#4D4000; --surface:#24242C; --ink:#FFFFFF; --sub:#B8B8C4; --line:#3C3C48;
    --glass:#1E1E25; --sun:#FFD400; --sun-deep:#F5A300; --danger:#FF5A4F;
  }
}
:root[data-theme="dark"]{
  --bg:#16161B; --bg2:#4D4000; --surface:#24242C; --ink:#FFFFFF; --sub:#B8B8C4; --line:#3C3C48;
    --glass:#1E1E25; --sun:#FFD400; --sun-deep:#F5A300; --danger:#FF5A4F;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overflow-x:hidden}
.wrap{overflow-x:clip}
body{margin:0;min-height:100%;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% -10%,var(--bg2) 0%,transparent 70%);
  background-attachment:fixed;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
.settings{display:flex;flex-direction:column;gap:14px}
.sgroup{background:var(--surface);border-radius:24px;box-shadow:inset 0 0 0 3px var(--line),0 6px 0 var(--line);overflow:hidden}
.sgroup h3{margin:0;padding:14px 18px 4px;font-size:.85rem;color:var(--sub)}
.sitem{display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;text-align:left;padding:14px 18px;font-size:1rem;font-weight:700}
.sitem + .sitem{border-top:2px dotted var(--line)}
.sitem .si{font-size:1.4rem;width:32px;text-align:center}
.sitem .sd{display:block;font-size:.8rem;font-weight:500;color:var(--sub);margin-top:2px}
.sitem.danger{color:var(--danger)}
.sitem:active{background:var(--bg2)}
.about{text-align:center;color:var(--sub);font-size:.82rem;line-height:1.8;padding:8px}
.top.compact .total,.top.compact .total-sub{display:none}
.top.compact .total-label{font-size:1.9rem;font-weight:900;color:var(--ink)}
:focus-visible{outline:3px solid var(--sun-deep);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 120px}

header.top{padding:16px 4px 24px;position:relative}
.sunburst{position:absolute;right:-30px;top:-40px;width:170px;height:170px;pointer-events:none;
  animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.total-label{font-size:.95rem;color:var(--sub);margin:0;font-weight:700}
.total{font-size:clamp(2.6rem,12vw,3.8rem);font-weight:900;letter-spacing:-.02em;margin:2px 0 6px;font-variant-numeric:tabular-nums;
  display:inline-block;background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%);padding:0 6px;margin-left:-6px}
.total small{font-size:.45em;font-weight:700;margin-left:4px}
.total.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.08)}}
.total-sub{font-size:.92rem;color:var(--sub);margin:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.box{position:relative;aspect-ratio:1/1.15;border:none;border-radius:26px;background:var(--glass);
  overflow:hidden;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:inset 0 0 0 3px var(--line),0 6px 0 var(--line);transition:transform .15s}
.box:active{transform:translateY(3px) scale(.97)}
.box.enter{animation:boxIn .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes boxIn{from{opacity:0;transform:translateY(24px) scale(.85)}}
.box.jiggle{animation:jiggle .6s ease}
@keyframes jiggle{20%{transform:rotate(-4deg) scale(1.04)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(1deg)}}
.box .fill{position:absolute;left:0;right:0;bottom:0;background:var(--c);transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.box .wave{position:absolute;left:0;top:-13px;width:200%;height:14px;color:var(--c);animation:wave 3.2s linear infinite}
.box .wave.back{opacity:.45;top:-17px;animation-duration:5s;animation-direction:reverse}
@keyframes wave{to{transform:translateX(-50%)}}
.box .fill[data-zero] .wave{display:none}
.box > *:not(.fill){position:relative;z-index:1}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.box .chip{font-size:.72rem;padding:3px 8px;background:var(--surface);position:relative;z-index:1}
.box .amt .lbl{font-size:.72rem;font-weight:700;margin-right:4px;opacity:.85}
.box.over .amt{color:var(--danger)!important;text-shadow:none!important}
.box.over{box-shadow:inset 0 0 0 3px var(--danger),0 6px 0 var(--line)}
.box.low .fill{animation:lowPulse 1.6s ease-in-out infinite}
@keyframes lowPulse{50%{filter:brightness(1.15) saturate(1.2)}}
.box .emoji{font-size:2rem;line-height:1;display:inline-block;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(-4deg)}}
.box .name{font-weight:700;font-size:1rem;margin:0;word-break:break-word}
.box .amt{font-weight:900;font-size:1.25rem;font-variant-numeric:tabular-nums;margin:2px 0 0}
.box .pct{font-size:.8rem;font-weight:700;opacity:.85}
.box.on-fill .name,.box.on-fill .amt,.box.on-fill .pct{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.box.done::after{content:"🎉";position:absolute;top:10px;right:12px;font-size:1.3rem;z-index:2;animation:float 2s ease-in-out infinite}
.box.add{background:transparent;box-shadow:none;border:3px dashed var(--sun-deep);
  align-items:center;justify-content:center;color:var(--sub);font-weight:700;gap:6px}
.box.add .plus{font-size:1.6rem;line-height:1;width:52px;height:52px;border-radius:50%;background:var(--sun);color:#1F1F24;
  display:grid;place-items:center;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}

.empty{text-align:center;color:var(--sub);padding:28px 8px 8px;font-size:.95rem;line-height:1.8}

.scrim{position:fixed;inset:0;background:rgba(20,20,30,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);
  border-radius:28px 28px 0 0;max-height:88%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .45s cubic-bezier(.25,1.25,.4,1);max-width:720px;margin:0 auto;
  box-shadow:0 -6px 0 var(--sun)}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px;position:relative}
.grab::before{content:"";position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px}
.sheet.dragging{transition:none}
.grab-zone{cursor:grab;touch-action:none}
.sheet h2{margin:0 0 4px;font-size:1.35rem;display:flex;align-items:center;gap:8px}
.meta{color:var(--sub);font-size:.88rem;margin:0 0 14px}
.bar{height:14px;border-radius:7px;background:var(--glass);overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.bar > i{display:block;height:100%;background:var(--c);border-radius:7px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.25) 0 8px,transparent 8px 16px);background-size:23px 100%;animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:23px 0}}
.big{font-size:2.2rem;font-weight:900;font-variant-numeric:tabular-nums;margin:10px 0 4px;display:inline-block}
.big.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:block;font-size:.85rem;color:var(--sub);margin:14px 0 6px;font-weight:700}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:12px 14px;border-radius:14px;
  border:2px solid var(--line);background:var(--glass);font-size:1rem;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--sun-deep);box-shadow:0 0 0 4px rgba(255,212,0,.4)}
.btn{border:none;border-radius:16px;padding:13px 18px;font-weight:900;font-size:1rem;background:var(--sun);color:#1F1F24;
  box-shadow:0 4px 0 var(--sun-deep);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-deep)}
.btn.soft{background:var(--glass);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--line)}
.btn.soft:active{box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--line)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 2px var(--danger)}
.btn.wide{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.quick button{border:none;border-radius:999px;padding:7px 12px;background:var(--glass);box-shadow:inset 0 0 0 2px var(--line);font-size:.88rem;font-weight:700;transition:transform .12s}
.quick button:active{transform:scale(.92)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:none;background:var(--s);transition:transform .2s}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink);transform:scale(1.1)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:42px;height:42px;border-radius:12px;border:none;background:var(--glass);font-size:1.3rem;transition:transform .2s}
.emojis button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--sun-deep);background:var(--bg2);transform:scale(1.1)}
.hist{list-style:none;padding:0;margin:8px 0 0}
.hist li{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:2px dotted var(--line);font-size:.92rem}
.hist li.new{animation:slideIn .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}}
.hist .d{color:var(--sub);font-size:.8rem}
.hist .p{font-weight:700;font-variant-numeric:tabular-nums}
.hist .p.minus{color:var(--danger)}
.sec{margin-top:22px;font-size:1rem}
.note{font-size:.82rem;color:var(--sub);line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px) scale(.9);
  background:var(--sun);color:#1F1F24;padding:11px 20px;border-radius:999px;font-weight:900;font-size:.92rem;
  box-shadow:0 4px 0 var(--sun-deep);opacity:0;transition:.35s cubic-bezier(.3,1.5,.5,1);z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.coin{position:absolute;top:-40px;font-size:1.8rem;animation:drop var(--d,1s) cubic-bezier(.4,0,.6,1) forwards}
@keyframes drop{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(var(--y,60vh)) rotate(var(--r,360deg));opacity:0}}
.confetti{position:absolute;width:10px;height:14px;border-radius:3px;top:-20px;animation:fall var(--d,2.4s) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--x,0),105vh) rotate(var(--r,720deg))}}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.fx{display:none}}
.wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.view{animation:viewIn .4s cubic-bezier(.25,1.2,.4,1)}
.view.from-left{animation-name:viewInL}
@keyframes viewIn{from{opacity:0;transform:translateX(28px)}}
@keyframes viewInL{from{opacity:0;transform:translateX(-28px)}}

/* bottom menu */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs{pointer-events:auto;display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:6px;position:relative;
  box-shadow:0 0 0 3px var(--line),0 8px 24px rgba(0,0,0,.12);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:transparent;border-radius:999px;padding:9px 18px;display:flex;align-items:center;gap:6px;
  font-weight:700;font-size:.95rem;color:var(--sub);position:relative;z-index:1;white-space:nowrap;transition:color .25s}
.tab .ti{font-size:1.25rem;line-height:1;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tab[aria-current=page]{color:#1F1F24}
.tab[aria-current=page] .ti{transform:scale(1.2) rotate(-8deg)}
.pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:var(--sun);box-shadow:0 3px 0 var(--sun-deep);
  transition:left .4s cubic-bezier(.3,1.3,.5,1),width .4s cubic-bezier(.3,1.3,.5,1)}

/* wallets */
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.wcard{position:relative;border:none;text-align:left;background:var(--surface);border-radius:24px;padding:16px 16px 14px;
  box-shadow:inset 0 0 0 3px var(--line),0 6px 0 var(--line);transition:transform .15s;overflow:hidden}
.wcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.wcard:active{transform:translateY(3px) scale(.98)}
.wcard.enter{animation:boxIn .55s cubic-bezier(.3,1.5,.5,1) both}
.wcard.jiggle{animation:jiggle .6s ease}
.wtop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wtop .emoji{font-size:1.6rem;display:inline-block;animation:float 3s ease-in-out infinite}
.wname{font-weight:700;font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 2px var(--line);color:var(--sub);white-space:nowrap}
.wleft{display:flex;align-items:baseline;gap:6px;margin:2px 0 10px}
.wleft .lbl{font-size:.85rem;color:var(--sub);font-weight:700}
.wleft b{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wleft small{font-weight:700}
.wcard.over .wleft b,.wcard.over .wleft small{color:var(--danger)}
.gauge{height:14px;border-radius:7px;background:var(--glass);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.gauge > i{display:block;height:100%;border-radius:7px;background:var(--c);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.gauge.low > i{background:#FF7A00}
.wfoot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.82rem;color:var(--sub);flex-wrap:wrap}
.wfoot b{color:var(--ink)}
.add-row{border:3px dashed var(--sun-deep);background:transparent;border-radius:24px;padding:18px;display:flex;align-items:center;
  justify-content:center;gap:10px;font-weight:700;color:var(--sub);min-height:96px}
.add-row .plus{font-size:1.4rem;width:44px;height:44px;border-radius:50%;background:var(--sun);color:#1F1F24;display:grid;place-items:center;animation:breathe 2.4s ease-in-out infinite}
.add-row.enter{animation:boxIn .55s cubic-bezier(.3,1.5,.5,1) both}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.stat{background:var(--glass);border-radius:16px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--line)}
.stat span{display:block;font-size:.78rem;color:var(--sub);font-weight:700}
.stat b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.big.over{color:var(--danger)}
.bill{position:absolute;bottom:-40px;font-size:1.8rem;animation:rise var(--d,1.2s) cubic-bezier(.3,0,.6,1) forwards}
@keyframes rise{to{transform:translate(var(--x,0),-55vh) rotate(var(--r,30deg));opacity:0}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:none;border-radius:999px;padding:8px 14px;background:var(--glass);box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:.9rem}
.seg button[aria-pressed=true]{background:var(--sun);box-shadow:0 3px 0 var(--sun-deep);color:#1F1F24}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="sunburst" viewBox="0 0 100 100" aria-hidden="true"><g fill="#FFD400"><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(0 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(30 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(60 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(90 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(120 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(150 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(180 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(210 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(240 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(270 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(300 50 50)"/><rect x="48" y="2" width="4" height="18" rx="2" transform="rotate(330 50 50)"/></g><circle cx="50" cy="50" r="20" fill="#FFD400"/></svg>
    <p class="total-label" id="totalLabel">&nbsp;</p>
    <p class="total" id="total">0<small>円</small></p>
    <p class="total-sub" id="totalSub">読み込み中…</p>
  </header>
  <main id="main"><noscript><h1>マネーBOX</h1><p>マネーBOXは、目的別に貯金を分けられる「Box」と、食費・日用品など予算ごとに残りがひと目でわかる「おさいふ」で、お金を楽しく管理できる無料の家計アプリです。登録不要、データはすべて端末の中だけに保存されます。</p><p>このアプリを使うには、JavaScriptを有効にしてください。</p></noscript></main>
</div>

<nav class="tabbar" aria-label="メニュー"><div class="tabs" id="tabs"><span class="pill" id="pill"></span></div></nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab-zone" id="grabZone"><div class="grab"></div></div>
  <div id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>
<div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function(){
/* =========================================================
   共通
   ========================================================= */
const COLORS=["#FFC400","#FF7A00","#FF3D7F","#00C27A","#1E9BFF","#8C4DFF","#00BFD8","#FF3B30"];
const OLD_COLORS=["#FFB800","#FF8A3D","#FF6B8B","#3CC48A","#3DA9F5","#A07CF2","#F2C200","#FF5E3A"];
const yen=n=>Math.round(n).toLocaleString("ja-JP");
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ym=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const today=()=>ymd(new Date());
// その月に指定日がない場合（31日など）は月末に合わせる
const dateOn=(y,m,day)=>{const f=new Date(y,m,1);const last=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();return new Date(f.getFullYear(),f.getMonth(),Math.min(day,last))};
const fmtDate=t=>{const d=new Date(t);return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const MAX_HIST=300;

let state={boxes:[],wallets:[]};
let ready=false, firstRender=true, shownTotal=0, jiggleId=null;

function countTo(el,to){
  if(reduce){el.innerHTML=yen(to)+"<small>円</small>";shownTotal=to;return}
  const from=shownTotal, t0=performance.now(), dur=900;
  if(from!==to){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
  shownTotal=to;
  (function step(t){const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    el.innerHTML=yen(from+(to-from)*e)+"<small>円</small>"; if(k<1)requestAnimationFrame(step)})(t0);
}
function coins(n){
  if(reduce)return; const fx=$("#fx");
  for(let i=0;i<n;i++){const c=document.createElement("span");c.className="coin";c.textContent=Math.random()<.7?"🪙":"✨";
    c.style.left=(10+Math.random()*80)+"%";c.style.setProperty("--d",(0.8+Math.random()*.7)+"s");
    c.style.setProperty("--y",(35+Math.random()*30)+"vh");c.style.setProperty("--r",(Math.random()*720-360)+"deg");
    c.style.animationDelay=(Math.random()*.35)+"s";fx.appendChild(c);setTimeout(()=>c.remove(),2000)}
}
function bills(n){
  if(reduce)return; const fx=$("#fx");
  for(let i=0;i<n;i++){const c=document.createElement("span");c.className="bill";c.textContent=Math.random()<.6?"💸":"🪙";
    c.style.left=(15+Math.random()*70)+"%";c.style.setProperty("--d",(1+Math.random()*.6)+"s");
    c.style.setProperty("--x",(Math.random()*120-60)+"px");c.style.setProperty("--r",(Math.random()*80-40)+"deg");
    c.style.animationDelay=(Math.random()*.3)+"s";fx.appendChild(c);setTimeout(()=>c.remove(),2200)}
}
function confetti(){
  if(reduce)return; const fx=$("#fx"), cols=["#FFD400","#FF7A00","#FF3D7F","#00C27A","#1E9BFF","#8C4DFF"];
  for(let i=0;i<90;i++){const c=document.createElement("span");c.className="confetti";
    c.style.left=Math.random()*100+"%";c.style.background=cols[i%cols.length];
    c.style.setProperty("--x",(Math.random()*160-80)+"px");c.style.setProperty("--r",(Math.random()*1080)+"deg");
    c.style.setProperty("--d",(1.8+Math.random()*1.4)+"s");c.style.animationDelay=(Math.random()*.5)+"s";
    fx.appendChild(c);setTimeout(()=>c.remove(),3600)}
}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2200)}
function trimHist(x){if(x.history.length>MAX_HIST)x.history.length=MAX_HIST}

/* ---------- 保存：この端末の中だけ（外部送信なし） ---------- */
const STORE_KEY="okane:v1", TAB_KEY="okane:tab";
const Cap=window.Capacitor;
const isNative=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
const plugin=name=>{if(!isNative)return null;try{return (Cap.Plugins&&Cap.Plugins[name])||(Cap.registerPlugin&&Cap.registerPlugin(name))||null}catch(e){return null}};
const Prefs=plugin("Preferences"), Haptics=plugin("Haptics"), FS=plugin("Filesystem"), Share=plugin("Share");
const Store={
  async get(k){
    if(Prefs){const r=await Prefs.get({key:k});return r&&r.value!=null?r.value:null}
    try{return localStorage.getItem(k)}catch(e){return null}
  },
  async set(k,v){
    if(Prefs) return Prefs.set({key:k,value:v});
    try{localStorage.setItem(k,v)}catch(e){}
  },
  async remove(k){
    if(Prefs) return Prefs.remove({key:k});
    try{localStorage.removeItem(k)}catch(e){}
  }
};
/* 触覚フィードバック（iPhoneのみ・失敗しても無視） */
const buzz={
  tap(){Haptics&&Haptics.selectionChanged&&Haptics.selectionChanged().catch(()=>{})},
  light(){Haptics&&Haptics.impact&&Haptics.impact({style:"LIGHT"}).catch(()=>{})},
  medium(){Haptics&&Haptics.impact&&Haptics.impact({style:"MEDIUM"}).catch(()=>{})},
  success(){Haptics&&Haptics.notification&&Haptics.notification({type:"SUCCESS"}).catch(()=>{})},
  warn(){Haptics&&Haptics.notification&&Haptics.notification({type:"WARNING"}).catch(()=>{})}
};
let saveTimer=null, saving=Promise.resolve();
function normalize(d){
  const fix=x=>{const k=OLD_COLORS.indexOf(x.color);if(k>=0)x.color=COLORS[k];return x};
  if(d){(d.boxes||[]).forEach(fix);(d.wallets||[]).forEach(fix)}
  return {boxes:Array.isArray(d&&d.boxes)?d.boxes:[], wallets:Array.isArray(d&&d.wallets)?d.wallets:[]};
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const json=JSON.stringify(state);
    saving=saving.then(()=>Store.set(STORE_KEY,json)).catch(()=>toast("保存に失敗しました。端末の空き容量を確認してください"));
  },250);
}
function flushSave(){ if(saveTimer){clearTimeout(saveTimer);saveTimer=null;return Store.set(STORE_KEY,JSON.stringify(state))} return saving; }
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushSave()});

/* ---------- 共通シート（下から出る） ---------- */
function openSheet(html){ buzz.light();
  $("#sheetBody").innerHTML=html; $("#sheet").style.transform=""; $("#scrim").style.opacity="";
  $("#scrim").classList.add("open"); $("#sheet").classList.add("open");
}
function closeSheet(){
  const sh=$("#sheet"), sc=$("#scrim");
  sh.style.transition="transform .28s cubic-bezier(.3,0,.6,1)";
  sh.style.transform=""; sc.style.opacity="";
  sc.classList.remove("open"); sh.classList.remove("open");
  setTimeout(()=>{sh.style.transition=""},320);
}
$("#scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
(function(){ // 下スワイプで閉じる
  const sh=$("#sheet"), sc=$("#scrim");
  let startY=0,lastY=0,lastT=0,vel=0,dy=0,active=false,decided=false;
  function begin(y,onGrab){
    if(!sh.classList.contains("open")) return;
    startY=lastY=y; lastT=performance.now(); vel=0; dy=0;
    active=onGrab||sh.scrollTop<=0; decided=onGrab;
    if(onGrab) sh.classList.add("dragging");
  }
  function move(y,e){
    if(!active) return;
    const d=y-startY;
    if(!decided){
      if(Math.abs(d)<6) return;
      if(d<0||sh.scrollTop>0){active=false;return}
      decided=true; sh.classList.add("dragging");
    }
    if(e&&e.cancelable) e.preventDefault();
    const now=performance.now(); vel=(y-lastY)/Math.max(1,now-lastT); lastY=y; lastT=now;
    dy=d>0?d:d*0.15;
    sh.style.transform=`translateY(${dy}px)`;
    sc.style.opacity=String(Math.max(0,1-dy/(sh.offsetHeight||1)));
  }
  function end(){
    if(!active||!decided){active=false;return}
    active=false; sh.classList.remove("dragging");
    if(dy>sh.offsetHeight*0.28||vel>0.6){ closeSheet(); }
    else{
      sh.style.transition="transform .35s cubic-bezier(.25,1.3,.4,1)";
      sh.style.transform=""; sc.style.transition="opacity .3s"; sc.style.opacity="";
      setTimeout(()=>{sh.style.transition="";sc.style.transition=""},380);
    }
  }
  const isField=t=>t.closest&&t.closest("input,select,textarea");
  sh.addEventListener("touchstart",e=>{if(isField(e.target))return;begin(e.touches[0].clientY,!!e.target.closest("#grabZone"))},{passive:true});
  sh.addEventListener("touchmove",e=>move(e.touches[0].clientY,e),{passive:false});
  sh.addEventListener("touchend",end); sh.addEventListener("touchcancel",end);
  $("#grabZone").addEventListener("pointerdown",e=>{
    if(e.pointerType==="touch")return;
    begin(e.clientY,true);
    const mv=ev=>move(ev.clientY,ev), up=()=>{end();removeEventListener("pointermove",mv);removeEventListener("pointerup",up)};
    addEventListener("pointermove",mv); addEventListener("pointerup",up);
  });
})();

/* ---------- 共通パーツ ---------- */
function pickerHTML(emojis,emoji,color){
  return `<label class="f">アイコン</label>
    <div class="emojis">${emojis.map(e=>`<button type="button" data-e="${e}" aria-pressed="${e===emoji}">${e}</button>`).join("")}</div>
    <label class="f">色</label>
    <div class="swatches">${COLORS.map(c=>`<button type="button" style="--s:${c}" data-c="${c}" aria-label="色 ${c}" aria-pressed="${c===color}"></button>`).join("")}</div>`;
}
function bindPicker(sel){
  $$("#sheet .emojis button").forEach(x=>x.onclick=()=>{sel.emoji=x.dataset.e;$$("#sheet .emojis button").forEach(y=>y.setAttribute("aria-pressed",y===x))});
  $$("#sheet .swatches button").forEach(x=>x.onclick=()=>{sel.color=x.dataset.c;$$("#sheet .swatches button").forEach(y=>y.setAttribute("aria-pressed",y===x))});
}
function dayOptions(sel){return Array.from({length:31},(_,i)=>`<option value="${i+1}" ${sel===i+1?"selected":""}>${i+1}日</option>`).join("")}
function quickHTML(){return `<div class="quick">${[100,500,1000,5000].map(v=>`<button type="button" data-v="${v}">+${yen(v)}</button>`).join("")}</div>`}
function bindQuick(input){$$("#sheet .quick button").forEach(q=>q.onclick=()=>{input.value=(Number(input.value)||0)+Number(q.dataset.v)})}
function histHTML(list,fresh){
  return list.length?`<ul class="hist">${list.slice(0,40).map((h,i)=>`<li class="${fresh&&i===0?"new":""}"><span>${esc(h.note||"")}<br><span class="d">${fmtDate(h.t)}</span></span>
    <span class="p ${h.amt<0?"minus":""}">${h.amt===0?"":(h.amt>0?"+":"−")+yen(Math.abs(h.amt))+"円"}</span></li>`).join("")}</ul>`
    :`<p class="note">まだ履歴がありません。</p>`;
}
function confirmDelete(name,emoji,detail,onCancel,onOk){
  openSheet(`<h2 id="sheetTitle"><span>${emoji}</span>「${esc(name)}」を削除しますか？</h2>
    <p class="meta">${detail}元に戻せません。</p>
    <div class="btns"><button class="btn soft" id="cancelDel">やめる</button><button class="btn danger" id="okDel">削除する</button></div>`);
  $("#cancelDel").onclick=onCancel; $("#okDel").onclick=onOk;
}
function animateBars(){requestAnimationFrame(()=>requestAnimationFrame(()=>$$("[data-w]").forEach(b=>b.style.width=b.dataset.w+"%")))}

/* ---------- 水が入ったタイル（Box・おさいふ共通） ---------- */
const WAVE='<path d="M0 10 Q12.5 2 25 10 T50 10 T75 10 T100 10 T125 10 T150 10 T175 10 T200 10 V20 H0Z" fill="currentColor"/>';
function waterTile({p,color,anim,i,classes,label,top,bottom,onClick}){
  const el=document.createElement("button");
  el.className="box"+(p>.62?" on-fill":"")+(anim?" enter":"")+(classes||"");
  if(anim) el.style.animationDelay=(i*70)+"ms";
  el.style.setProperty("--c",color);
  el.setAttribute("aria-label",label);
  el.innerHTML=`<div class="fill" style="height:${anim?0:p*100}%" data-h="${p*100}" ${p<=0?"data-zero":""}><svg class="wave back" viewBox="0 0 200 20" preserveAspectRatio="none">${WAVE}</svg><svg class="wave" viewBox="0 0 200 20" preserveAspectRatio="none">${WAVE}</svg></div>
    <div class="tile-top">${top}</div><div>${bottom}</div>`;
  el.onclick=onClick;
  return el;
}
function addTile(text,anim,i,onClick){
  const add=document.createElement("button");
  add.className="box add"+(anim?" enter":""); if(anim) add.style.animationDelay=(i*70)+"ms";
  add.innerHTML=`<span class="plus">＋</span><span>${text}</span>`;
  add.onclick=onClick; return add;
}
function fillUp(g){requestAnimationFrame(()=>requestAnimationFrame(()=>g.querySelectorAll(".fill").forEach(f=>f.style.height=f.dataset.h+"%")))}

/* =========================================================
   機能1：Box（貯金）
   ========================================================= */
const BoxFeature={
  id:"box", label:"Box", icon:"🐷",
  EMOJIS:["✈️","💻","🏠","🎁","🎓","🚗","💍","🍣","🐶","🎮","☂️","💪","📷","🌱","👶","🎸"],
  header(){
    const total=state.boxes.reduce((s,b)=>s+b.balance,0);
    const goal=state.boxes.reduce((s,b)=>s+(b.target||0),0);
    return {label:"Boxの合計",total,sub:state.boxes.length?state.boxes.length+"個のBox"+(goal?"、目標合計 "+yen(goal)+"円":""):"まだBoxがありません"};
  },
  tick(){ // 自動積立
    let changed=false; const now=new Date();
    state.boxes.forEach(b=>{
      if(!b.auto||!(b.auto.amount>0)) return;
      const day=Math.min(31,Math.max(1,b.auto.day||1));
      let [y,m]=(b.lastAuto||ym(new Date(b.created||Date.now()))).split("-").map(Number), guard=0;
      while(guard++<36){
        m++; if(m>12){m=1;y++}
        const due=dateOn(y,m-1,day); if(due>now) break;
        b.balance+=b.auto.amount; b.history.unshift({t:due.getTime(),amt:b.auto.amount,note:"自動積立"});
        b.lastAuto=y+"-"+pad(m); changed=true;
      }
      trimHist(b);
    });
    return changed;
  },
  render(main,anim){
    const g=document.createElement("div"); g.className="grid";
    state.boxes.forEach((b,i)=>{
      const p=b.target?Math.min(1,b.balance/b.target):0;
      g.appendChild(waterTile({p,color:b.color,anim,i,
        classes:(b.target&&p>=1?" done":"")+(jiggleId===b.id?" jiggle":""),
        label:b.name+" "+yen(b.balance)+"円",
        top:`<span class="emoji">${b.emoji}</span>`,
        bottom:`<p class="name">${esc(b.name)}</p><p class="amt">${yen(b.balance)}円</p>
          <span class="pct">${b.target?Math.floor(p*100)+"%":"目標なし"}</span>`,
        onClick:()=>this.detail(b.id)}));
    });
    g.appendChild(addTile("Boxを作る",anim,state.boxes.length,()=>this.edit(null)));
    main.appendChild(g);
    if(!state.boxes.length){const p=document.createElement("p");p.className="empty";
      p.innerHTML="最初のBoxを作ってみましょう。<br>「旅行」「新しいPC」「もしもの備え」など、目的ごとに分けると貯めやすくなります。";main.appendChild(p)}
    if(anim) fillUp(g);
  },
  remain(b){
    if(!b.target) return "";
    const r=b.target-b.balance;
    if(r<=0) return "目標達成！🎉";
    let s="あと"+yen(r)+"円";
    if(b.deadline){
      const now=new Date(), dl=new Date(b.deadline+"T00:00:00");
      const months=(dl.getFullYear()-now.getFullYear())*12+(dl.getMonth()-now.getMonth());
      if(dl<now) s+="（期限を過ぎています）";
      else if(months>=1) s+="、毎月 約"+yen(Math.ceil(r/months))+"円で間に合います";
      else s+="、期限まで1ヶ月未満";
    }
    return s;
  },
  detail(id,fresh){
    const b=state.boxes.find(x=>x.id===id); if(!b) return;
    const p=b.target?Math.min(1,b.balance/b.target):0;
    openSheet(`
      <h2 id="sheetTitle"><span>${b.emoji}</span>${esc(b.name)}</h2>
      <p class="meta">${b.target?"目標 "+yen(b.target)+"円":"目標金額なし"}${b.deadline?"、期限 "+b.deadline.replace(/-/g,"/"):""}${b.auto&&b.auto.amount?"、毎月"+b.auto.day+"日に"+yen(b.auto.amount)+"円を自動積立":""}</p>
      <div style="--c:${b.color}">
        <p class="big${fresh?" pop":""}">${yen(b.balance)}円</p>
        ${b.target?`<div class="bar"><i data-w="${p*100}"></i></div><p class="meta" style="margin-top:8px">${this.remain(b)}</p>`:""}
      </div>
      <label class="f" for="amt">金額</label>
      <input id="amt" type="number" inputmode="numeric" min="1" step="1" placeholder="例：5000">
      ${quickHTML()}
      <div class="btns"><button class="btn" id="dep">入れる</button><button class="btn soft" id="wd">取り出す</button></div>
      <h3 class="sec">履歴</h3>
      ${histHTML(b.history,fresh)}
      <div class="btns" style="margin-top:22px"><button class="btn soft" id="edit">Boxを編集</button><button class="btn danger" id="del">Boxを削除</button></div>`);
    animateBars();
    const amt=$("#amt"); bindQuick(amt);
    const move=sign=>{
      const v=Math.floor(Number(amt.value));
      if(!(v>0)){toast("金額を入力してください");amt.focus();return}
      if(sign<0&&v>b.balance){toast("Boxの残高より多くは取り出せません");return}
      const wasDone=b.target&&b.balance>=b.target;
      b.balance+=sign*v; b.history.unshift({t:Date.now(),amt:sign*v,note:sign>0?"入金":"出金"}); trimHist(b);
      jiggleId=b.id; save(); render(); this.detail(b.id,true);
      if(sign>0) coins(Math.min(14,4+Math.floor(v/2000)));
      buzz.medium();
      if(sign>0&&!wasDone&&b.target&&b.balance>=b.target){confetti();buzz.success();setTimeout(()=>toast("🎉 目標達成！おめでとう！"),300);return}
      toast(sign>0?yen(v)+"円を入れました":yen(v)+"円を取り出しました");
    };
    $("#dep").onclick=()=>move(1); $("#wd").onclick=()=>move(-1);
    $("#edit").onclick=()=>this.edit(b.id);
    $("#del").onclick=()=>confirmDelete(b.name,b.emoji,`残高 ${yen(b.balance)}円と履歴もすべて消えます。`,()=>this.detail(b.id),()=>{
      state.boxes=state.boxes.filter(x=>x.id!==b.id); save(); render(); closeSheet(); toast("Boxを削除しました");
    });
  },
  edit(id){
    const b=id?state.boxes.find(x=>x.id===id):null;
    const sel={color:b?b.color:COLORS[state.boxes.length%COLORS.length], emoji:b?b.emoji:this.EMOJIS[state.boxes.length%this.EMOJIS.length]};
    openSheet(`
      <h2 id="sheetTitle">${b?"Boxを編集":"新しいBox"}</h2>
      <label class="f" for="nm">名前</label>
      <input id="nm" type="text" maxlength="20" placeholder="例：沖縄旅行" value="${b?esc(b.name):""}">
      ${pickerHTML(this.EMOJIS,sel.emoji,sel.color)}
      <label class="f" for="tg">目標金額（任意）</label>
      <input id="tg" type="number" inputmode="numeric" min="0" placeholder="例：80000" value="${b&&b.target?b.target:""}">
      <label class="f" for="dl">期限（任意）</label>
      <input id="dl" type="date" value="${b&&b.deadline?b.deadline:""}" min="${today()}">
      <label class="f" for="aa">毎月の自動積立（任意）</label>
      <div class="row" style="flex-wrap:nowrap">
        <select id="ad" style="width:40%" aria-label="積立日">${dayOptions(b&&b.auto?b.auto.day:25)}</select>
        <input id="aa" type="number" inputmode="numeric" min="0" placeholder="金額" value="${b&&b.auto&&b.auto.amount?b.auto.amount:""}">
      </div>
      <p class="note">29〜31日を選んだ場合、その日がない月は月末に積み立てます。設定した日を過ぎてこのページを開くと、その月の分が自動でBoxに入ります。実際の口座のお金は動きません。</p>
      ${!b?`<label class="f" for="init">最初に入れる金額（任意）</label><input id="init" type="number" inputmode="numeric" min="0" placeholder="例：10000">`:""}
      <button class="btn wide" id="ok" style="margin-top:20px">${b?"変更を保存":"Boxを作る"}</button>`);
    bindPicker(sel);
    $("#ok").onclick=()=>{
      const name=$("#nm").value.trim();
      if(!name){toast("Boxの名前を入力してください");$("#nm").focus();return}
      const target=Math.max(0,Math.floor(Number($("#tg").value)||0));
      const deadline=$("#dl").value||"";
      const aAmt=Math.max(0,Math.floor(Number($("#aa").value)||0));
      const auto=aAmt?{amount:aAmt,day:Number($("#ad").value)}:null;
      if(b){
        const autoChanged=JSON.stringify(b.auto)!==JSON.stringify(auto);
        Object.assign(b,{name,emoji:sel.emoji,color:sel.color,target,deadline,auto});
        if(autoChanged) b.lastAuto=ym(new Date());
        save(); render(); this.detail(b.id); toast("変更を保存しました");
      }else{
        const init=Math.max(0,Math.floor(Number($("#init").value)||0));
        const nb={id:uid(),name,emoji:sel.emoji,color:sel.color,target,deadline,auto,created:Date.now(),lastAuto:ym(new Date()),balance:init,
          history:init?[{t:Date.now(),amt:init,note:"入金"}]:[]};
        const nowD=new Date(); if(auto&&nowD<dateOn(nowD.getFullYear(),nowD.getMonth(),auto.day)){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);nb.lastAuto=ym(d)}
        jiggleId=nb.id; state.boxes.push(nb); save(); render(); closeSheet(); if(init) coins(8);
        toast("「"+name+"」を作りました");
      }
    };
  }
};

/* =========================================================
   機能2：おさいふ（予算管理）
   ========================================================= */
const WalletFeature={
  id:"wallet", label:"おさいふ", icon:"👛",
  EMOJIS:["🍙","🛒","🧴","🚃","☕","👕","💊","🎉","🍺","📚","🐱","⛽","💡","🎮","💄","🧸"],
  // 直近のリセット日（今日以前で一番新しい「毎月◯日」）
  lastResetDate(day,now=new Date()){
    const d=dateOn(now.getFullYear(),now.getMonth(),day);
    return d>now?dateOn(now.getFullYear(),now.getMonth()-1,day):d;
  },
  nextResetDate(day,now=new Date()){
    const d=dateOn(now.getFullYear(),now.getMonth(),day);
    return d<=now?dateOn(now.getFullYear(),now.getMonth()+1,day):d;
  },
  daysLeft(w){
    if(!w.resetDay) return null;
    const n=this.nextResetDate(w.resetDay), t=new Date(); t.setHours(0,0,0,0);
    return Math.max(1,Math.round((n-t)/86400000));
  },
  spent(w){ // 今の期間で使った額
    return w.history.filter(h=>h.t>=(w.periodStart||0)&&h.kind==="spend").reduce((s,h)=>s-h.amt,0);
  },
  tick(){ // 毎月の予算リセット
    let changed=false;
    state.wallets.forEach(w=>{
      if(!w.resetDay) return;
      const last=this.lastResetDate(w.resetDay), key=ymd(last);
      if(w.lastReset&&w.lastReset>=key) return;
      const left=w.balance;
      w.balance=w.budget+(w.carry&&left>0?left:0);
      w.history.unshift({t:last.getTime(),amt:0,note:"予算をリセット"+(w.carry&&left>0?"（"+yen(left)+"円を繰り越し）":""),kind:"reset"});
      w.lastReset=key; w.periodStart=last.getTime(); trimHist(w); changed=true;
    });
    return changed;
  },
  header(){
    const total=state.wallets.reduce((s,w)=>s+w.balance,0);
    const budget=state.wallets.reduce((s,w)=>s+(w.budget||0),0);
    return {label:"おさいふの残り合計",total,sub:state.wallets.length?state.wallets.length+"個のおさいふ、予算合計 "+yen(budget)+"円":"まだおさいふがありません"};
  },
  render(main,anim){
    const g=document.createElement("div"); g.className="grid";
    state.wallets.forEach((w,i)=>{
      const p=w.budget?Math.max(0,Math.min(1,w.balance/w.budget)):0;
      const dl=this.daysLeft(w);
      const perDay=dl&&w.balance>0?Math.floor(w.balance/dl):null;
      const over=w.balance<0;
      g.appendChild(waterTile({p,color:w.color,anim,i,
        classes:(over?" over":"")+(p<.2&&!over?" low":"")+(jiggleId===w.id?" jiggle":""),
        label:w.name+(over?" オーバー ":" のこり ")+yen(Math.abs(w.balance))+"円",
        top:`<span class="emoji">${w.emoji}</span>${dl?`<span class="chip">あと${dl}日</span>`:""}`,
        bottom:`<p class="name">${esc(w.name)}</p>
          <p class="amt"><span class="lbl">${over?"オーバー":"のこり"}</span>${yen(Math.abs(w.balance))}円</p>
          <span class="pct">${perDay!==null?"1日 "+yen(perDay)+"円まで":"予算 "+yen(w.budget)+"円"}</span>`,
        onClick:()=>this.detail(w.id)}));
    });
    g.appendChild(addTile("おさいふを作る",anim,state.wallets.length,()=>this.edit(null)));
    main.appendChild(g);
    if(!state.wallets.length){const p=document.createElement("p");p.className="empty";
      p.innerHTML="「食費」「日用品」「交際費」など、予算ごとにおさいふを作ると<br>あといくら使えるかがひと目でわかります。";main.appendChild(p)}
    if(anim) fillUp(g);
  },
  detail(id,fresh){
    const w=state.wallets.find(x=>x.id===id); if(!w) return;
    const ratio=w.budget?Math.max(0,Math.min(1,w.balance/w.budget)):0;
    const dl=this.daysLeft(w);
    const spent=this.spent(w);
    openSheet(`
      <h2 id="sheetTitle"><span>${w.emoji}</span>${esc(w.name)}</h2>
      <p class="meta">予算 ${yen(w.budget)}円${w.resetDay?"、毎月"+w.resetDay+"日にリセット":""}${w.carry?"（残りは繰り越し）":""}</p>
      <div style="--c:${w.color}">
        <p class="meta" style="margin:0">${w.balance<0?"予算オーバー":"のこり"}</p>
        <p class="big${fresh?" pop":""}${w.balance<0?" over":""}">${yen(Math.abs(w.balance))}円</p>
        <div class="bar"><i data-w="${ratio*100}"></i></div>
      </div>
      <div class="stats">
        <div class="stat"><span>${w.resetDay?"今期に使った額":"使った額"}</span><b>${yen(spent)}円</b></div>
        <div class="stat"><span>${dl?"1日あたり（あと"+dl+"日）":"リセットなし"}</span><b>${dl?(w.balance>0?yen(Math.floor(w.balance/dl))+"円":"0円"):"―"}</b></div>
      </div>
      <label class="f" for="amt">金額</label>
      <input id="amt" type="number" inputmode="numeric" min="1" step="1" placeholder="例：1280">
      ${quickHTML()}
      <label class="f" for="memo">メモ（任意）</label>
      <input id="memo" type="text" maxlength="30" placeholder="例：スーパー">
      <div class="btns"><button class="btn" id="spend">使った</button><button class="btn soft" id="refill">補充する</button></div>
      <h3 class="sec">履歴</h3>
      ${histHTML(w.history,fresh)}
      <div class="btns" style="margin-top:22px"><button class="btn soft" id="edit">おさいふを編集</button><button class="btn danger" id="del">おさいふを削除</button></div>`);
    animateBars();
    const amt=$("#amt"); bindQuick(amt);
    const act=kind=>{
      const v=Math.floor(Number(amt.value));
      if(!(v>0)){toast("金額を入力してください");amt.focus();return}
      const memo=$("#memo").value.trim();
      const wasOk=w.balance>=0;
      const sign=kind==="spend"?-1:1;
      w.balance+=sign*v;
      w.history.unshift({t:Date.now(),amt:sign*v,note:memo||(kind==="spend"?"支出":"補充"),kind}); trimHist(w);
      jiggleId=w.id; save(); render(); this.detail(w.id,true);
      buzz.medium();
      if(kind==="spend"){
        bills(Math.min(10,3+Math.floor(v/2000)));
        if(wasOk&&w.balance<0) buzz.warn();
        if(wasOk&&w.balance<0) toast("予算を"+yen(-w.balance)+"円オーバーしました");
        else toast(yen(v)+"円を記録しました");
      }else{ coins(6); toast(yen(v)+"円を補充しました"); }
    };
    $("#spend").onclick=()=>act("spend"); $("#refill").onclick=()=>act("refill");
    $("#edit").onclick=()=>this.edit(w.id);
    $("#del").onclick=()=>confirmDelete(w.name,w.emoji,"残高と履歴もすべて消えます。",()=>this.detail(w.id),()=>{
      state.wallets=state.wallets.filter(x=>x.id!==w.id); save(); render(); closeSheet(); toast("おさいふを削除しました");
    });
  },
  edit(id){
    const w=id?state.wallets.find(x=>x.id===id):null;
    const sel={color:w?w.color:COLORS[(state.wallets.length+3)%COLORS.length], emoji:w?w.emoji:this.EMOJIS[state.wallets.length%this.EMOJIS.length]};
    let reset=w?(w.resetDay?"monthly":"none"):"monthly";
    openSheet(`
      <h2 id="sheetTitle">${w?"おさいふを編集":"新しいおさいふ"}</h2>
      <label class="f" for="nm">名前</label>
      <input id="nm" type="text" maxlength="20" placeholder="例：食費" value="${w?esc(w.name):""}">
      ${pickerHTML(this.EMOJIS,sel.emoji,sel.color)}
      <label class="f" for="bg">予算</label>
      <input id="bg" type="number" inputmode="numeric" min="1" placeholder="例：40000" value="${w?w.budget:""}">
      <label class="f">予算のリセット</label>
      <div class="seg" id="seg"><button type="button" data-v="monthly" aria-pressed="${reset==="monthly"}">毎月リセット</button><button type="button" data-v="none" aria-pressed="${reset==="none"}">リセットしない</button></div>
      <div id="monthlyOpts" class="${reset==="monthly"?"":"hidden"}">
        <label class="f" for="rd">リセット日（給料日など）</label>
        <select id="rd">${dayOptions(w&&w.resetDay?w.resetDay:25)}</select>
        <p class="note">29〜31日を選んだ場合、その日がない月は月末にリセットします。</p>
        <label class="f">残ったお金</label>
        <div class="seg" id="carry"><button type="button" data-v="0" aria-pressed="${!(w&&w.carry)}">リセットで消す</button><button type="button" data-v="1" aria-pressed="${!!(w&&w.carry)}">翌月に繰り越す</button></div>
      </div>
      ${w?`<p class="note">予算額を変えると、今の残りも差額のぶん増減します。</p>`:""}
      <button class="btn wide" id="ok" style="margin-top:20px">${w?"変更を保存":"おさいふを作る"}</button>`);
    bindPicker(sel);
    let carry=!!(w&&w.carry);
    $$("#seg button").forEach(x=>x.onclick=()=>{reset=x.dataset.v;$$("#seg button").forEach(y=>y.setAttribute("aria-pressed",y===x));$("#monthlyOpts").classList.toggle("hidden",reset!=="monthly")});
    $$("#carry button").forEach(x=>x.onclick=()=>{carry=x.dataset.v==="1";$$("#carry button").forEach(y=>y.setAttribute("aria-pressed",y===x))});
    $("#ok").onclick=()=>{
      const name=$("#nm").value.trim();
      if(!name){toast("おさいふの名前を入力してください");$("#nm").focus();return}
      const budget=Math.floor(Number($("#bg").value)||0);
      if(!(budget>0)){toast("予算を入力してください");$("#bg").focus();return}
      const resetDay=reset==="monthly"?Number($("#rd").value):0;
      if(w){
        const diff=budget-w.budget;
        const dayChanged=w.resetDay!==resetDay;
        Object.assign(w,{name,emoji:sel.emoji,color:sel.color,budget,resetDay,carry:resetDay?carry:false});
        w.balance+=diff;
        if(dayChanged&&resetDay){const l=this.lastResetDate(resetDay);w.lastReset=ymd(l);}
        save(); render(); this.detail(w.id); toast("変更を保存しました");
      }else{
        const now=Date.now();
        const nw={id:uid(),name,emoji:sel.emoji,color:sel.color,budget,resetDay,carry:resetDay?carry:false,balance:budget,created:now,
          lastReset:resetDay?ymd(this.lastResetDate(resetDay)):"",periodStart:now,history:[{t:now,amt:0,note:"おさいふを作成",kind:"reset"}]};
        jiggleId=nw.id; state.wallets.push(nw); save(); render(); closeSheet(); coins(6);
        toast("「"+name+"」を作りました");
      }
    };
  }
};

/* =========================================================
   設定（バックアップ・復元・データ削除）
   ========================================================= */
const APP={name:"マネーBOX",version:"1.0.0",privacyUrl:""}; // ← privacyUrl に公開したプライバシーポリシーのURLを入れる
const SettingsFeature={
  id:"settings", label:"設定", icon:"⚙️",
  header(){return {label:"設定",total:null,sub:""}},
  render(main){
    const nB=state.boxes.length, nW=state.wallets.length;
    main.innerHTML=`<div class="settings">
      <div class="sgroup"><h3>バックアップ</h3>
        <button class="sitem" id="exp"><span class="si">📤</span><span>データを書き出す<span class="sd">ファイルに保存して、iCloud Driveなどに置いておけます</span></span></button>
        <button class="sitem" id="imp"><span class="si">📥</span><span>データを読み込む<span class="sd">書き出したファイルから復元します（機種変更のときなど）</span></span></button>
      </div>
      <div class="sgroup"><h3>データ</h3>
        <button class="sitem danger" id="wipe"><span class="si">🗑️</span><span>すべてのデータを削除<span class="sd">Box ${nB}個、おさいふ ${nW}個</span></span></button>
      </div>
      ${APP.privacyUrl?`<div class="sgroup"><a class="sitem" href="${esc(APP.privacyUrl)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span class="si">🔒</span><span>プライバシーポリシー</span></a></div>`:""}
      <p class="about">${APP.name} ${APP.version}<br>データはすべてこのiPhoneの中にだけ保存され、外部に送信されることはありません。<br>機種変更やアプリの削除に備えて、ときどきバックアップを書き出してください。</p>
      <input type="file" id="impFile" accept="application/json,.json" class="hidden">
    </div>`;
    $("#exp").onclick=()=>this.exportData();
    $("#imp").onclick=()=>$("#impFile").click();
    $("#impFile").onchange=e=>{const f=e.target.files[0]; e.target.value=""; if(f) this.importFile(f)};
    $("#wipe").onclick=()=>{
      openSheet(`<h2 id="sheetTitle">すべてのデータを削除しますか？</h2>
        <p class="meta">Boxとおさいふの残高・履歴がすべて消えます。元に戻せません。必要なら先にバックアップを書き出してください。</p>
        <div class="btns"><button class="btn soft" id="cancelDel">やめる</button><button class="btn danger" id="okDel">削除する</button></div>`);
      $("#cancelDel").onclick=closeSheet;
      $("#okDel").onclick=async()=>{state={boxes:[],wallets:[]};await Store.set(STORE_KEY,JSON.stringify(state));buzz.warn();closeSheet();render();toast("すべてのデータを削除しました")};
    };
  },
  async exportData(){
    await flushSave();
    const d=new Date(), stamp=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
    const name="okane-backup-"+stamp+".json";
    const json=JSON.stringify({app:"okane",format:1,exportedAt:d.toISOString(),data:state},null,2);
    try{
      if(FS&&Share){
        const r=await FS.writeFile({path:name,data:json,directory:"CACHE",encoding:"utf8"});
        await Share.share({title:APP.name+" のバックアップ",url:r.uri});
      }else{
        const a=document.createElement("a");
        a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
        a.download=name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),2000);
        toast("バックアップを書き出しました");
      }
    }catch(e){ if(!(e&&/cancel/i.test(String(e.message||e)))) toast("書き出しに失敗しました"); }
  },
  importFile(file){
    const r=new FileReader();
    r.onload=()=>{
      let d=null; try{d=JSON.parse(r.result)}catch(e){}
      const data=d&&d.app==="okane"&&d.data?d.data:null;
      if(!data||!Array.isArray(data.boxes)&&!Array.isArray(data.wallets)){toast("このファイルは読み込めません");buzz.warn();return}
      const nd=normalize(JSON.parse(JSON.stringify(data)));
      openSheet(`<h2 id="sheetTitle">このバックアップで復元しますか？</h2>
        <p class="meta">${d.exportedAt?fmtDate(d.exportedAt)+" に書き出したデータです。":""}Box ${nd.boxes.length}個、おさいふ ${nd.wallets.length}個が入っています。<br>今このiPhoneにあるデータは置き換わります。</p>
        <div class="btns"><button class="btn soft" id="cancelImp">やめる</button><button class="btn" id="okImp">復元する</button></div>`);
      $("#cancelImp").onclick=closeSheet;
      $("#okImp").onclick=async()=>{
        state=nd; tickAll(); await Store.set(STORE_KEY,JSON.stringify(state));
        buzz.success(); closeSheet(); render(); coins(10); toast("データを復元しました");
      };
    };
    r.onerror=()=>toast("ファイルを読み込めませんでした");
    r.readAsText(file);
  }
};

/* =========================================================
   メニュー（機能はここに追加していく）
   ========================================================= */
const FEATURES=[BoxFeature,WalletFeature,SettingsFeature];
let current=FEATURES[0].id;
let animNext=true, slideLeft=false;

function buildTabs(){
  const tabs=$("#tabs");
  FEATURES.forEach(f=>{
    const b=document.createElement("button");
    b.className="tab"; b.dataset.id=f.id;
    b.innerHTML=`<span class="ti">${f.icon}</span><span>${f.label}</span>`;
    b.onclick=()=>switchTo(f.id);
    tabs.appendChild(b);
  });
  updateTabs();
  addEventListener("resize",movePill);
}
function updateTabs(){
  $$(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.id===current?"page":"false"));
  movePill();
}
function movePill(){
  const t=$(`.tab[data-id="${current}"]`); if(!t) return;
  const p=$("#pill"); p.style.left=t.offsetLeft+"px"; p.style.width=t.offsetWidth+"px";
}
function switchTo(id){
  if(id===current) return;
  const from=FEATURES.findIndex(f=>f.id===current), to=FEATURES.findIndex(f=>f.id===id);
  slideLeft=to<from; current=id; animNext=true;
  Store.set(TAB_KEY,id); buzz.tap();
  updateTabs(); shownTotal=0; render(); scrollTo({top:0,behavior:reduce?"auto":"smooth"});
}

function render(){
  const f=FEATURES.find(x=>x.id===current);
  const main=$("#main"); main.innerHTML="";
  if(!ready){$("#totalLabel").textContent=f.label;$("#totalSub").textContent="読み込み中…";return}
  const h=f.header();
  $("#totalLabel").textContent=h.label; $("#totalSub").textContent=h.sub;
  $(".top").classList.toggle("compact",h.total==null);
  if(h.total!=null) countTo($("#total"),h.total);
  const view=document.createElement("div");
  view.className="view"+(animNext&&!firstRender&&slideLeft?" from-left":"");
  if(!animNext) view.style.animation="none";
  main.appendChild(view);
  f.render(view,animNext);
  animNext=false; firstRender=false; jiggleId=null;
}
function tickAll(){return FEATURES.map(f=>f.tick?f.tick():false).some(Boolean)}

async function init(){
  try{
    const t=await Store.get(TAB_KEY); if(FEATURES.some(f=>f.id===t)) current=t;
    let raw=await Store.get(STORE_KEY);
    if(raw==null){ // 旧バージョン（ブラウザ保存）からの引き継ぎ
      try{raw=localStorage.getItem("savingsBox:v1")}catch(e){}
      if(raw) await Store.set(STORE_KEY,raw);
    }
    if(raw) state=normalize(JSON.parse(raw));
  }catch(e){ toast("データの読み込みに失敗しました"); }
  buildTabs();
  if(tickAll()) save();
  ready=true; animNext=true; render();
}
init();
})();
</script>
